<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    .card {
      width: 1200px;
      height: 630px;
      position: relative;
      font-family: Manrope, sans-serif;
      color: #f6f1e6;
    }
    img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .veil {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(16,18,14,.78) 0%, rgba(16,18,14,.28) 58%, rgba(16,18,14,.12) 100%),
        linear-gradient(180deg, rgba(16,18,14,.1), rgba(16,18,14,.55));
    }
    .inner {
      position: relative;
      z-index: 1;
      height: 100%;
      padding: 56px 64px 48px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
    }
    .brand { display: flex; align-items: center; gap: 16px; }
    .mark {
      width: 56px; height: 56px; border: 1.6px solid rgba(246,241,230,.85); border-radius: 12px;
      display: grid; place-items: center;
    }
    .name { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
    .sub { font-size: 13px; opacity: .72; margin-top: 2px; }
    .kicker {
      font-family: "IBM Plex Mono", monospace;
      letter-spacing: .14em;
      text-transform: uppercase;
      font-size: 13px;
      color: #d7c8a4;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0;
      font-size: 64px;
      line-height: .98;
      letter-spacing: -.04em;
      font-weight: 700;
      max-width: 11ch;
    }
    .bottom {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 24px;
    }
    .lead { max-width: 34ch; font-size: 20px; line-height: 1.35; color: #e6ddc8; }
    .meta {
      font-family: "IBM Plex Mono", monospace;
      letter-spacing: .1em;
      text-transform: uppercase;
      font-size: 12px;
      color: #cfc5ad;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="images/hero.jpg" alt="">
    <div class="veil"></div>
    <div class="inner">
      <div class="brand">
        <div class="mark">
          <svg width="32" height="32" viewBox="0 0 42 42" fill="none">
            <path d="M11 28.5h20M11 21h20M14 14.5h14" stroke="#F3ECDE" stroke-width="1.8" stroke-linecap="square"/>
            <path d="M11 14.5v14M31 14.5v14M21 14.5v14" stroke="#C45C32" stroke-width="1.8"/>
          </svg>
        </div>
        <div>
          <div class="name">Мебель-Сервис</div>
          <div class="sub">ООО «Мебель-Сервис» · Нижний Новгород</div>
        </div>
      </div>
      <div>
        <div class="kicker">Производство мебели для объектов</div>
        <h1>Мебель, которая выдерживает объект</h1>
      </div>
      <div class="bottom">
        <p class="lead">Армейская мебель, металлические кровати, металлокаркас и ЛДСП. Серийные поставки.</p>
        <div class="meta">4 000+ м2 · опт · под ТЗ</div>
      </div>
    </div>
  </div>
</body>
</html>
